<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 배경 그라데이션 (팬텀 퍼플 -> 코스믹 인디고) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- 글로우 효과 필터 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 별빛 그라데이션 -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- iOS 스타일 둥근 모서리 배경 (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 은은한 내부 테두리 -->
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#a78bfa" stroke-width="6" opacity="0.3" />

  <!-- 겐가릴레오 뿔/귀 실루엣 (상단 큐트 포인트) -->
  <path d="M 120 180 L 160 120 L 200 170 Z" fill="#7c3aed" opacity="0.85" />
  <path d="M 392 180 L 352 120 L 312 170 Z" fill="#7c3aed" opacity="0.85" />

  <!-- 캘린더 바디 베이스 -->
  <rect x="106" y="160" width="300" height="260" rx="36" fill="#0f172a" opacity="0.9" />
  <rect x="106" y="160" width="300" height="260" rx="36" fill="none" stroke="#6366f1" stroke-width="5" opacity="0.6" />

  <!-- 캘린더 상단 바 -->
  <path d="M 106 196 C 106 176 122 160 142 160 L 370 160 C 390 160 406 176 406 196 L 406 226 L 106 226 Z" fill="#4f46e5" />

  <!-- 캘린더 바인더 링 2개 -->
  <rect x="166" y="136" width="28" height="48" rx="14" fill="#38bdf8" filter="url(#glow)" />
  <rect x="318" y="136" width="28" height="48" rx="14" fill="#38bdf8" filter="url(#glow)" />

  <!-- 겐가릴레오 붉은 눈빛 모티프 (팬텀의 매력적인 눈빛) -->
  <circle cx="196" cy="286" r="16" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="198" cy="284" r="6" fill="#ffffff" />

  <circle cx="316" cy="286" r="16" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="318" cy="284" r="6" fill="#ffffff" />

  <!-- 갈릴레오 천체 별빛 심볼 (중앙 하단 빛나는 ✦) -->
  <path d="M 256 312 Q 256 348 220 348 Q 256 348 256 384 Q 256 348 292 348 Q 256 348 256 312 Z" fill="url(#starGrad)" filter="url(#glow)" />

  <!-- 하단 롤링 전광판 펄스 라인 (스마트 비서 표시) -->
  <path d="M 150 400 L 220 400 L 235 390 L 255 410 L 275 390 L 290 400 L 362 400" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
