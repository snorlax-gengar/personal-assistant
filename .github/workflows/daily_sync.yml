name: Gengarileo Assistant Daily Sync & Calendar Publisher

on:
  schedule:
    # 한국 시간(KST) 05:00 (UTC 20:00) 수집, 08:00 (UTC 23:00) 수집 + 모닝 브리핑
    # ※ GitHub 스케줄은 혼잡 시 10~30분 늦게 시작될 수 있습니다.
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      send_briefing:
        description: '텔레그램 브리핑도 보낼까요?'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'scripts/**'
      - 'data/schedules.json'   # 맥 앱에서 개인 일정을 올리면 캘린더/웹 즉시 갱신

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v6

      - name: 🐍 Python 환경 구성
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🚀 실적 발표 & 수도권 청약 실데이터 수집
        run: |
          python3 scripts/sync_collector.py
          python3 scripts/generate_ics.py

      - name: 📢 텔레그램 모닝 브리핑 (08시 실행분에서만 1회 발송)
        if: github.event.schedule == '0 23 * * *' || (github.event_name == 'workflow_dispatch' && inputs.send_briefing)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/telegram_briefing.py

      - name: 💾 최신 캘린더 파일 저장소 자동 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json data/sync_status.json public/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 캘린더 및 일정 데이터 자동 갱신 [skip ci]"
            # 그 사이 맥 앱이 푸시했을 수 있으므로 rebase 후 푸시
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

      - name: 📦 GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: 🌐 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
