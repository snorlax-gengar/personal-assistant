name: Gengarileo Assistant Daily Sync & Calendar Publisher

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 05:00 실행 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 최신 주식 실발 & 수도권 청약 자동 수집
        run: |
          python3 scripts/sync_collector.py
          python3 scripts/generate_ics.py

      - name: 💾 최신 캘린더 파일 저장소 자동 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json public/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 캘린더 및 일정 데이터 자동 갱신 [skip ci]"
            git push
          fi

      - name: 📦 GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: 🌐 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
